title: "Idea: "
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Questlight to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you with?
      description: The situation in the game where you wanted this.
    validations:
      required: true
