name: Release

# Pushing a version tag such as v1.0.0 builds the site and publishes a GitHub release with
# the single-file questlight.html attached, for people who want to keep an offline copy.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release and upload the file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Publish the release with the offline file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/questlight.html --repo "$GITHUB_REPOSITORY" --title "Questlight $TAG" --generate-notes --verify-tag
